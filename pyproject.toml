[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weibull-spares"
version = "1.0.0"
description = "Lifetime analysis for parts with censored field data: Weibull fits from scrap reasons, location trends, lifetime cost, maintenance events and spares."
readme = "README.md"
license = "MIT"
authors = [{ name = "Awais Hanif Qurashi" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1"]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
weibull-spares = "weibull_spares.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weibull_spares"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
